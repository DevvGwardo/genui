# genui — continuous integration.
#
# Every step is a zero-dependency command that also runs on local workstations;
# see LOOPS.md for the local green/red rehearsal behind each one.
#
# Actions are pinned to a commit SHA and kept current by Dependabot
# (.github/dependabot.yml). Superseded runs on the same ref are cancelled.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 20
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Contract checkers (bounds, errors, terminology)
        run: |
          node tools/check-bounds.mjs
          node tools/check-errors.mjs
          node tools/check-terms.mjs

      - name: Lint SKILL.md frontmatter and security hygiene
        run: node tools/check-skill-frontmatter.mjs

      - name: Check relative links and anchors
        run: node tools/check-links.mjs

      - name: Enforce docs/ image budget
        run: node tools/check-docs-budget.mjs

      - name: Run the examples suite (valid, invalid, boundary)
        run: python3 tools/check-examples.py

      - name: Validate payloads embedded in README and SKILL.md
        run: python3 tools/check-doc-payloads.py

      - name: Run differential validator fuzzer
        run: node tools/fuzz-validator.mjs

      - name: Run deterministic skill eval suite
        run: node tools/check-evals.mjs

      - name: Check upstream provenance registry and ledger parity
        run: node tools/check-upstream.mjs

      - name: Build and verify reproducible skill archive
        run: python3 tools/package-skill.py --verify
